<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pongus</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body.fullscreen {
            width: 100vw;
            height: 100vh;
        }
        .container.fullscreen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container.fullscreen h1 {
            display: none;
        }
        .container.fullscreen #gameCanvas {
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pongus</h1>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="controls">
            <button id="startBtn" class="btn" onclick="startGameFromUI()">Start Game</button>
            <button id="pauseBtn" class="btn">Pause</button>
            <button id="settingsBtn" class="btn">Settings</button>
            <button id="fullscreenBtn" class="btn">Fullscreen (F)</button>
        </div>
        <div class="info">
            <p><strong>Player 1 (Blue):</strong> W/S to move, Q for ability</p>
            <p><strong>Player 2 (Red):</strong> Up = <strong>'</strong> (single-quote), Down = <strong>/</strong>, Ability = <strong>;</strong></p>
            <p><strong>Fullscreen:</strong> Press F key or click Fullscreen button</p>
            <p id="gameStatus"></p>
        </div>
    </div>

    <!-- On-page debug console (appears when errors/logs are captured) -->
    <div id="debugConsole" style="position:fixed;right:12px;bottom:12px;max-width:420px;max-height:240px;overflow:auto;background:rgba(0,0,0,0.8);color:#0ff;border:2px solid #0ff;padding:8px;border-radius:8px;font-family:monospace;font-size:12px;display:none;z-index:2000">Debug Console</div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Game Settings</h2>
            <div class="settings-group">
                <label>
                    <input type="radio" name="gameMode" value="single" checked> Single Player (vs AI)
                </label>
                <label>
                    <input type="radio" name="gameMode" value="local"> Local 2 Player
                </label>
            </div>
            <div class="settings-group">
                <label>AI Difficulty:</label>
                <select id="aiDifficulty">
                    <option value="1">Easy</option>
                    <option value="2" selected>Normal</option>
                    <option value="3">Hard</option>
                    <option value="4">Impossible</option>
                </select>
            </div>
            <div class="settings-group">
                <label>
                    <input type="checkbox" id="enableLearningAI" checked> Enable Learning AI (Difficulty 4 only)
                </label>
            </div>
            <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:12px;">
                <button id="modalStartBtn" class="btn" onclick="startGameFromUI()">Start Game</button>
                <button class="btn" onclick="closeSettings()">Close</button>
            </div>
        </div>
    </div>

    <!-- Level Up Modal -->
    <div id="levelUpModal" class="modal">
        <div class="modal-content modal-large">
            <h2 id="levelUpTitle">ABILITY EVOLUTION!</h2>
            <div id="levelUpContent" style="text-align: center; margin: 20px 0;">
                <p id="levelUpMessage"></p>
            </div>
            <div id="branchContainer" style="display: none; margin: 20px 0;">
                <p id="branchPrompt" style="margin-bottom: 15px;"></p>
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <button id="branch1Btn" class="btn branch-btn" style="flex: 1; min-width: 150px;"></button>
                    <button id="branch2Btn" class="btn branch-btn" style="flex: 1; min-width: 150px;"></button>
                </div>
            </div>
            <div id="noActionContainer" style="display: none;">
                <button id="levelUpCloseBtn" class="btn" style="width: 100%; padding: 12px;">Close</button>
            </div>
        </div>
    </div>

    <!-- Cheat Menu Modal -->
    <div id="cheatMenuModal" class="modal">
        <div class="modal-content modal-large">
            <h2 id="cheatMenuTitle">CHEAT MENU</h2>
            <div id="cheatMenuContent" style="text-align: center;">
                <p id="cheatMenuPrompt" style="margin-bottom: 15px;"></p>
                <div id="cheatButtonContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>
        </div>
    </div>

    <!-- List Selection Modal -->
    <div id="listSelectModal" class="modal">
        <div class="modal-content modal-large">
            <h2 id="listSelectTitle">Select Option</h2>
            <div id="listSelectContent" style="text-align: left;">
                <div id="listSelectContainer" style="max-height: 400px; overflow-y: auto; border: 1px solid #00ffff; border-radius: 5px; padding: 10px;"></div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 15px; justify-content: center;">
                <button id="listSelectCancelBtn" class="btn" style="flex: 1;">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
